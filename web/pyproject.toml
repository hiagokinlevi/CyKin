[project]
name = "open-cyber-academy-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "bleach>=6,<7",
  "fastapi>=0.115,<1",
  "markdown>=3.7,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "workers-py",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["api"]
